global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local
    stack: oncall-agent

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  - job_name: oncall-agent
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:9900
        labels:
          service: oncall-agent

  - job_name: fault-lab
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:9910
        labels:
          service: fault-lab
          data_origin: live_local